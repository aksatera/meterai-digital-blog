server {
    listen 80;
    server_name blog.meterai.digital admin.blog.meterai.digital;
    root /usr/share/nginx/html;

    # Health check
    location /healthz {
        return 200 "ok";
    }

    # Admin panel — basic auth handled by K3s Ingress
    location /admin/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Blog
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
