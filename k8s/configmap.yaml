apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-nginx-config
  namespace: mdi
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        location /healthz { return 200 "ok"; }
        location /admin/ { index index.html; try_files $uri $uri/ =404; }
        location / { try_files $uri $uri/ $uri.html =404; }
    }
