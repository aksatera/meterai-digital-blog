apiVersion: apps/v1
kind: Deployment
metadata:
  name: meterai-blog
  namespace: mdi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meterai-blog
  template:
    metadata:
      labels:
        app: meterai-blog
    spec:
      initContainers:
      - name: hugo-build
        image: klakegg/hugo:latest
        env:
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: blog-credentials
              key: HUGO_PAT
        command:
        - sh
        - -c
        - |
          git config --global user.email "contact@aksatera.co.id"
          git config --global user.name "IT Support"
          git clone https://aksatera:${GITHUB_PAT}@github.com/aksatera/meterai-digital-blog.git /src
          cd /src
          hugo --minify
          cp -r public/* /output/
        volumeMounts:
        - name: site-data
          mountPath: /output
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site-data
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: site-data
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: blog-nginx-config
